# ==============================================================================
# SISTEM TERINTEGRASI: Docker Compose Infrastruktur Lokal & Produksi
# Sesuai docs/01-arsitektur.md & docs/03-keamanan.md
#
# Aturan Keamanan:
# 1. HANYA Caddy yang memiliki port binding ke host, dan DIBATASI ke 127.0.0.1
# 2. Seluruh layanan aplikasi (web, api, worker) berjalan non-root
# 3. Database, Redis, MinIO, dan ClamAV hanya berada di jaringan internal (internal_net)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # REVERSE PROXY & GATEWAY
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.9-alpine
    container_name: sistem_caddy
    restart: unless-stopped
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_net
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # FRONTEND (Next.js App Router)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: sistem_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - '3000'
    networks:
      - internal_net
    depends_on:
      api:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # BACKEND API (NestJS Modular Monolith)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: sistem_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sistem_db}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sistem-terintegrasi-files}
      - APP_SECRET=${APP_SECRET}
    expose:
      - '4000'
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:4000/ready']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # WORKER (BullMQ Job Processor - Placeholder untuk Tahap 2)
  # ----------------------------------------------------------------------------
  worker:
    image: node:22-alpine
    container_name: sistem_worker
    restart: unless-stopped
    user: node
    command:
      [
        'node',
        '-e',
        "console.log('[WORKER] BullMQ worker placeholder aktif. Pemrosesan antrean dimulai pada Tahap 2.'); setInterval(() => {}, 1000 * 60 * 60)",
      ]
    networks:
      - internal_net
    depends_on:
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # DATABASE (PostgreSQL 17+)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: sistem_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-sistem_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistem_db}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # CACHE & MESSAGE QUEUE (Redis 7+)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sistem_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # OBJECT STORAGE (MinIO - S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: sistem_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    volumes:
      - minio_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # ANTIVIRUS SCANNER (ClamAV Daemon)
  # ----------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:latest
    container_name: sistem_clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - internal_net
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 0']
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s

# ------------------------------------------------------------------------------
# JARINGAN INTERNAL (Tanpa ekspose keluar selain Caddy)
# ------------------------------------------------------------------------------
networks:
  internal_net:
    driver: bridge
    name: sistem_internal_net

# ------------------------------------------------------------------------------
# PERSISTENSI VOLUME BERNAMA
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: sistem_postgres_data
  redis_data:
    name: sistem_redis_data
  minio_data:
    name: sistem_minio_data
  clamav_db:
    name: sistem_clamav_db
  caddy_data:
    name: sistem_caddy_data
  caddy_config:
    name: sistem_caddy_config
